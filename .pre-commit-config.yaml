# =============================================================================
# Lumi (NeoGuide) — Git Pre-commit Hooks Configuration
# Qualidade, Tipagem Estática e Segurança Anti-Leak
# =============================================================================

default_language_version:
  python: python3.12

default_stages: [pre-commit]

exclude: ^(graphify-out/|\.worktrees/|planner/anexos/)

repos:
  # ---------------------------------------------------------------------------
  # Higiene e Validações Sintáticas Básicas
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  # ---------------------------------------------------------------------------
  # Qualidade e Formatação Python (Ruff)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # Checagem de Tipagem Estática (Mypy)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.8.0
          - pydantic-settings>=2.4.0
        args: [--ignore-missing-imports]
        exclude: ^(tests/|docs/|planner/)

  # ---------------------------------------------------------------------------
  # Segurança Anti-Leak (Prevenção de Vazamento de Segredos e API Keys)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: ^(uv\.lock|\.env\.example|graphify-out/|\.worktrees/|planner/|docs/)
