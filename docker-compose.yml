# =============================================================================
# Lumi (NeoGuide) — Orquestração de Containers Docker Compose
# Serviços: lumi-api (FastAPI + uv) e lumi-db (PostgreSQL 16 + pgvector)
# =============================================================================

services:
  lumi-db:
    image: pgvector/pgvector:pg16
    container_name: lumi-db
    restart: unless-stopped
    ports:
      # Mapeia na porta 5433 do host para NUNCA conflitar com o PostgreSQL do NeoGuide-Back (5432)
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumi_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./docker/data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lumi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lumi-network

  lumi-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: lumi-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@lumi-db:5432/${POSTGRES_DB:-lumi_db}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      lumi-db:
        condition: service_healthy
    networks:
      - lumi-network

networks:
  lumi-network:
    driver: bridge
